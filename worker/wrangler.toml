name = "invoiceapp"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "invoiceapp-uploads"

[dev]
port = 8787
